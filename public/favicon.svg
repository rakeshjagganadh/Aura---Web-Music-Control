<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="auraPulse" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="auraCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#090A0F" />
  <circle cx="32" cy="32" r="26" fill="url(#auraCenter)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1E2337" stroke-width="1.5" />

  <!-- Outer Orbit Ring / Sound Aura -->
  <circle cx="32" cy="32" r="23" stroke="url(#auraGlow)" stroke-width="2" stroke-dasharray="8 4 14 3" opacity="0.85" />
  <circle cx="32" cy="32" r="18" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />

  <!-- Frequency Equalizer Bars forming dynamic Aura Waveform -->
  <g filter="url(#glow)">
    <!-- Bar 1 (Left low) -->
    <rect x="17" y="27" width="3.5" height="10" rx="1.75" fill="url(#auraPulse)" />
    <!-- Bar 2 (Mid-left) -->
    <rect x="23" y="21" width="3.5" height="22" rx="1.75" fill="url(#auraGlow)" />
    <!-- Bar 3 (Center Peak) -->
    <rect x="29" y="15" width="3.5" height="34" rx="1.75" fill="#FFFFFF" />
    <!-- Bar 4 (Mid-right) -->
    <rect x="35" y="21" width="3.5" height="22" rx="1.75" fill="url(#auraGlow)" />
    <!-- Bar 5 (Right low) -->
    <rect x="41" y="27" width="3.5" height="10" rx="1.75" fill="url(#auraPulse)" />
  </g>

  <!-- Central Energy Core Spark -->
  <circle cx="30.75" cy="32" r="2" fill="#FFFFFF" opacity="0.9" />
</svg>
